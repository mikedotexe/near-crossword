[package]
name = "near-crossword-campaigns"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.24.1", features = ["legacy"] }
# near-sdk's lower bound is compatible with this toolchain; pin it so Cargo
# does not select newer near-sys releases with a higher Rust MSRV.
near-sys = "=0.2.7"

[dev-dependencies]
ed25519-dalek = "=2.2.0"
near-sdk = { version = "=5.24.1", features = ["legacy", "unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "s"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[workspace]
members = []
