services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: near_crossword
      POSTGRES_USER: near_crossword
      POSTGRES_PASSWORD: near_crossword_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U near_crossword -d near_crossword"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - near_crossword_postgres:/var/lib/postgresql/data

volumes:
  near_crossword_postgres:
